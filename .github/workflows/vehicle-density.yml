name: Vehicle Density Report

on:
  workflow_dispatch:
    inputs:
      s3-bucket:
        description: "S3 bucket name containing camera images"
        required: true
        type: string
      s3-prefix:
        description: "Prefix inside the bucket (omit leading slash)"
        required: false
        default: ""
        type: string
      aws-region:
        description: "AWS region for the S3 bucket"
        required: true
        type: string
      yolo-model:
        description: "Ultralytics YOLO model identifier to use"
        required: false
        default: "yolov8n.pt"
        type: string
      max-images:
        description: "Optional limit on number of images to download"
        required: false
        default: ""
        type: string
      conf-threshold:
        description: "YOLO confidence threshold"
        required: false
        default: "0.25"
        type: string

jobs:
  compute-density:
    name: Compute Vehicle Density
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ inputs.aws-region }}
        if: ${{ secrets.AWS_ROLE_TO_ASSUME != '' }}

      - name: Configure static AWS credentials
        if: ${{ secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != '' }}
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV
          if [ -n "${{ secrets.AWS_SESSION_TOKEN }}" ]; then
            echo "AWS_SESSION_TOKEN=${{ secrets.AWS_SESSION_TOKEN }}" >> $GITHUB_ENV
          fi
          if [ -n "${{ inputs.aws-region }}" ]; then
            echo "AWS_DEFAULT_REGION=${{ inputs.aws-region }}" >> $GITHUB_ENV
          fi

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ultralytics boto3 pillow

      - name: Run vehicle density computation
        env:
          S3_BUCKET: ${{ inputs.s3-bucket }}
          S3_PREFIX: ${{ inputs.s3-prefix }}
          AWS_REGION: ${{ inputs.aws-region }}
          YOLO_MODEL: ${{ inputs.yolo-model }}
          MAX_IMAGES: ${{ inputs.max-images }}
          CONF_THRESHOLD: ${{ inputs.conf-threshold }}
        run: |
          IMAGE_ROOT="staging/images"
          OUTPUT_DIR="outputs"
          mkdir -p "$IMAGE_ROOT" "$OUTPUT_DIR"

          EXTRA_ARGS=""
          if [ -n "$MAX_IMAGES" ]; then
            EXTRA_ARGS="${EXTRA_ARGS} --max-images $MAX_IMAGES"
          fi
          if [ -n "$CONF_THRESHOLD" ]; then
            EXTRA_ARGS="${EXTRA_ARGS} --conf-threshold $CONF_THRESHOLD"
          fi

          python scripts/compute_vehicle_density.py \
            --image-root "$IMAGE_ROOT" \
            --output-csv "$OUTPUT_DIR/vehicle_density.csv" \
            --model "$YOLO_MODEL" \
            --s3-bucket "$S3_BUCKET" \
            --s3-prefix "$S3_PREFIX" \
            --aws-region "$AWS_REGION" \
            $EXTRA_ARGS

      - name: Upload CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: vehicle-density-report
          path: outputs/vehicle_density.csv
          if-no-files-found: error
