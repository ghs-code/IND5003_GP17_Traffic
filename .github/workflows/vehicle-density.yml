name: Vehicle Density Report

on:
  workflow_dispatch:
    inputs:
      s3-bucket:
        description: "S3 bucket containing per-camera image folders"
        required: true
        type: string
      s3-prefix:
        description: "Prefix inside the S3 bucket (omit leading slash)"
        required: false
        default: ""
        type: string
      aws-region:
        description: "AWS region for the S3 bucket"
        required: false
        default: ""
        type: string
      yolo-model:
        description: "Ultralytics YOLO model identifier to use"
        required: false
        default: "yolov8n.pt"
        type: string
      max-images:
        description: "Optional limit on number of images to download"
        required: false
        default: ""
        type: string
      conf-threshold:
        description: "YOLO confidence threshold"
        required: false
        default: "0.25"
        type: string
      vehicle-classes:
        description: "Whitespace-separated class names to count (leave blank for defaults)"
        required: false
        default: ""
        type: string
      image-root:
        description: "Local staging directory for downloaded images"
        required: false
        default: "staging/images"
        type: string
      output-csv:
        description: "Path for the generated vehicle density CSV"
        required: false
        default: "outputs/vehicle_density.csv"
        type: string
      csv-s3-key:
        description: "Optional S3 object key to upload the CSV report (relative to bucket/prefix)"
        required: false
        default: ""
        type: string

jobs:
  compute-density:
    name: Compute Vehicle Density
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read
      actions: read
    env:
      AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ultralytics pillow boto3

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ inputs.aws-region }}
        if: ${{ env.AWS_ROLE_TO_ASSUME != '' }}

      - name: Configure static AWS credentials
        if: ${{ env.AWS_ACCESS_KEY_ID != '' && env.AWS_SECRET_ACCESS_KEY != '' }}
        run: |
          echo "AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}" >> $GITHUB_ENV
          if [ -n "${AWS_SESSION_TOKEN}" ]; then
            echo "AWS_SESSION_TOKEN=${AWS_SESSION_TOKEN}" >> $GITHUB_ENV
          fi

      - name: Run vehicle density computation
        env:
          S3_BUCKET: ${{ inputs.s3-bucket }}
          S3_PREFIX: ${{ inputs.s3-prefix }}
          AWS_REGION: ${{ inputs.aws-region }}
          YOLO_MODEL: ${{ inputs.yolo-model }}
          MAX_IMAGES: ${{ inputs.max-images }}
          CONF_THRESHOLD: ${{ inputs.conf-threshold }}
          VEHICLE_CLASSES: ${{ inputs.vehicle-classes }}
          IMAGE_ROOT: ${{ inputs.image-root }}
          OUTPUT_CSV: ${{ inputs.output-csv }}
          CSV_S3_KEY: ${{ inputs.csv-s3-key }}
        run: |
          set -euo pipefail

          IMAGE_ROOT="${IMAGE_ROOT:-staging/images}"
          OUTPUT_CSV="${OUTPUT_CSV:-outputs/vehicle_density.csv}"
          mkdir -p "$IMAGE_ROOT"
          OUTPUT_DIRNAME=$(dirname "$OUTPUT_CSV")
          if [ "$OUTPUT_DIRNAME" != "." ]; then
            mkdir -p "$OUTPUT_DIRNAME"
          fi

          OUTPUT_DIR="outputs"
          mkdir -p "$OUTPUT_DIR"

          args=(
            python scripts/compute_vehicle_density.py
            --image-root "$IMAGE_ROOT"
            --output-csv "$OUTPUT_CSV"
            --model "$YOLO_MODEL"
            --s3-bucket "$S3_BUCKET"
            --s3-prefix "$S3_PREFIX"
          )

          if [ -n "$AWS_REGION" ]; then
            args+=(--aws-region "$AWS_REGION")
          fi
          if [ -n "$CSV_S3_KEY" ]; then
            args+=(--csv-s3-key "$CSV_S3_KEY")
          fi
          if [ -n "$MAX_IMAGES" ]; then
            args+=(--max-images "$MAX_IMAGES")
          fi
          if [ -n "$CONF_THRESHOLD" ]; then
            args+=(--conf-threshold "$CONF_THRESHOLD")
          fi
          if [ -n "$VEHICLE_CLASSES" ]; then
            args+=(--classes $VEHICLE_CLASSES)
          fi

          "${args[@]}"

      - name: Upload CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: vehicle-density-report
          path: ${{ inputs.output-csv }}
          if-no-files-found: error
